# ============================================================================
# Quantora web — local verification server block (static-runtime image).
#
# Replaces conf.d/default.conf in nginxinc/nginx-unprivileged; the image's
# top-level nginx.conf (unprivileged PID path, temp directories) is untouched.
# This configuration exists only to verify the built SPA, the /api/ proxy, and
# cache headers locally — it is not a deployment artifact.
# ============================================================================

server {
    # The unprivileged image's conventional non-root port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # API proxy. proxy_pass has NO trailing slash or URI component, so
    # nginx forwards the original request URI unchanged (/api/v1/... stays
    # /api/v1/...). A trailing slash would strip the /api/ prefix and
    # break every endpoint. This block also guarantees /api/ never falls
    # through to index.html.
    #
    # Host uses $http_host (host INCLUDING port), so Django's
    # request.get_host() sees localhost:8080 and its CSRF origin check
    # matches the browser Origin directly — no CSRF_TRUSTED_ORIGINS
    # change needed for the local smoke test. X-Forwarded-* are set for
    # completeness; Django deliberately does not act on them yet
    # (SECURE_PROXY_SSL_HEADER is not configured).
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://django-api-prod:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed Vite bundles: content-addressed filenames, safe to cache
    # forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML document must always revalidate so a new deploy's hashed
    # asset references are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any other route serves the React document and the
    # client router takes over.
    location / {
        try_files $uri /index.html;
    }
}
